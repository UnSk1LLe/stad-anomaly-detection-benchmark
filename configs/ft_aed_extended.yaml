# Расширенная сетка на FT-AED: полный крест 5 энкодеров × 3 головы.
#
# Назначение одно: ответить на главный вопрос бенчмарка — что объясняет
# больше разброса качества, ось энкодера или ось механизма score.
# Результат идёт в теплокарту (фигура 04) и в разложение дисперсии (eta²),
# на котором держится правило R3 из docs/DECISION_RULES.md.
#
# Стоимость: 15 конфигураций × 5 сидов = 75 обучений. Запускать после
# того, как core-прогон прошёл и протокол валидирован.
name: ft_aed_extended
grid: extended
seeds: [0, 1, 2, 3, 4]
param_budget: 200000
# Рабочая точка: подтверждённых ложных тревог в час на ВСЮ сеть.
# Операционная единица вместо процента FPR: бюджет внимания диспетчера
# конечен, а поточечный FPR на сети из сотен узлов вырождается —
# при FPR 1% случайный score обнаруживает почти любое событие.
alarm_budget_per_hour: 1.0

half_life_min: 15.0
# Подтверждение тревоги: столько подряд идущих окон должны превысить порог.
# Логика взята из классических AID-алгоритмов (California): инцидент даёт
# устойчивый сигнал, шум — одиночные выбросы. Без подтверждения event-recall
# случайного score вырождается в 1.0 на сети из сотен узлов.
persistence: 3

primary_metric: padf
out_dir: reports/ft_aed_extended

datasets:
  ft_aed:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml

train:
  epochs: 40
  batch_size: 64
  lr: 0.001
  patience: 8
  device: auto
