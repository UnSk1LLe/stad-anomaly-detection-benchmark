# ИТОГОВЫЙ ПРОГОН ДЛЯ ДИССЕРТАЦИИ: 12 конфигураций на FT-AED.
#
# Это та таблица, которая идёт в главу 2 и защищается перед рецензентом:
# реальные метки (отчёты Nashville TMC + ручная разметка), lane-level,
# 5 сидов, выровненный бюджет параметров, event-level метрики.
#
# Перед запуском:
#   python scripts/download_data.py --dataset ft-aed
# и при необходимости правка configs/data/ft_aed.yaml под схему скачанных файлов.
name: ft_aed_core
grid: core
seeds: [0, 1, 2, 3, 4]

# 200k параметров — компромисс: достаточно для 196 узлов, но модель
# обучается на FT-AED за разумное время и помещается в память GPU ноутбука.
# Значение фиксируется ЗАРАНЕЕ и одинаково для всех конфигураций.
param_budget: 200000


# Полупериод затухания награды за скорость. 15 мин выбраны операционно:
# бенчмарк FT-AED сокращает задержку оповещения более чем на 10 минут,
# то есть именно этот масштаб и является предметом улучшения.
# Рабочая точка: подтверждённых ложных тревог в час на ВСЮ сеть.
# Операционная единица вместо процента FPR: бюджет внимания диспетчера
# конечен, а поточечный FPR на сети из сотен узлов вырождается —
# при FPR 1% случайный score обнаруживает почти любое событие.
alarm_budget_per_hour: 1.0

half_life_min: 15.0

# Подтверждение тревоги: столько подряд идущих окон должны превысить порог.
# Логика взята из классических AID-алгоритмов (California): инцидент даёт
# устойчивый сигнал, шум — одиночные выбросы. Без подтверждения event-recall
# случайного score вырождается в 1.0 на сети из сотен узлов.
persistence: 3

primary_metric: padf
out_dir: reports/ft_aed_core

datasets:
  ft_aed:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml

train:
  epochs: 40
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 8
  d_steps: 1
  device: auto
