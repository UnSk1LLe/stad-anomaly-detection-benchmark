# Прогон на реальных данных FT-AED: 12 конфигураций.
#
# ВНИМАНИЕ о бюджете вычислений. Этот конфиг рассчитан на машину без GPU
# (2 CPU): 2 сида, 12 эпох, шаг 2 мин. Результат — ПРЕДВАРИТЕЛЬНЫЙ: он
# валидирует протокол на реальных метках и даёт первое ранжирование, но
# для диссертации нужен прогон с 5 сидами и 40 эпохами на GPU —
# см. configs/ft_aed_full.yaml.
name: ft_aed_core
grid: core
seeds: [0, 1]

# 150k параметров: при шаге 2 мин и окне 8 этого достаточно для 196 узлов,
# и все архитектуры укладываются в допуск ±15%. Значение одинаково для всех.
param_budget: 150000

# Рабочая точка: подтверждённых ложных тревог в час на ВСЮ сеть.
# Операционная единица вместо процента FPR: бюджет внимания диспетчера
# конечен, а поточечный FPR на 196 узлах вырождается.
alarm_budget_per_hour: 1.0

# Полупериод затухания награды за скорость. 15 мин выбраны операционно:
# бенчмарк FT-AED сокращает задержку оповещения более чем на 10 минут.
half_life_min: 15.0

# Подтверждение тревоги: столько подряд идущих окон должны превысить порог
# (логика California). При шаге 2 мин это 6 минут устойчивого сигнала.
persistence: 3

primary_metric: padf
out_dir: reports/ft_aed_core

datasets:
  ft_aed:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml

train:
  epochs: 12
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 4
  d_steps: 1
  device: auto
