# Прогон на реальных данных FT-AED: кросс-валидация по дням.
#
# ПОЧЕМУ CV, А НЕ ОДИНОЧНЫЙ СПЛИТ. При одном holdout в тесте остаётся
# 18 событий из 63, и event-recall квантуется шагом 1/18 — различие
# между архитектурами тонет в этой зернистости. Четыре фолда дают
# 44 тестовых события и, что важнее для статистики, четыре блока для
# теста Фридмана вместо одного.
#
# Схема — rolling origin: обучение только на днях, ПРЕДШЕСТВУЮЩИХ
# тестовым. Это строже блочной CV, где модель видела бы будущее, и
# соответствует тому, как система работала бы в эксплуатации.
#
# Бюджет вычислений: рассчитано на 2 CPU без GPU. Один сид, 12 эпох.
# Результат предварительный; для диссертации — 5 сидов и 40 эпох на GPU.
name: ft_aed_cv
grid: core
seeds: [0]

param_budget: 150000

# Рабочая точка. 0.25 подтверждённой ложной тревоги в час = 10 тревог за
# 39 часов теста при 18 реальных событиях. Проверено эмпирически: при
# 1.0/ч случайный score выходит на уровень обученных моделей, потому что
# ложных тревог становится вдвое больше, чем реальных событий; при
# 0.25/ч он опускается к полу, а при 0.1/ч обнуляется.
alarm_budget_per_hour: 0.25

half_life_min: 15.0

# Подтверждение: 3 окна подряд = 6 минут устойчивого сигнала при шаге 2 мин.
persistence: 3

primary_metric: padf
out_dir: reports/ft_aed_cv

# Каждый фолд — отдельный «датасет» для раннера, то есть отдельный блок
# в тесте Фридмана. Так CV встраивается без изменений в сам раннер.
datasets:
  fold0:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 0}
  fold1:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 1}
  fold2:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 2}
  fold3:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 3}

train:
  epochs: 12
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 4
  d_steps: 1
  device: auto
