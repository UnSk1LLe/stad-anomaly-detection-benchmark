# Прогон на реальных данных FT-AED: кросс-валидация по дням.
#
# ПОЧЕМУ CV, А НЕ ОДИНОЧНЫЙ СПЛИТ. При одном holdout в тесте остаётся
# 18 событий из 63, и event-recall квантуется шагом 1/18 — различие
# между архитектурами тонет в этой зернистости. Четыре фолда по 3 тестовых
# дня дают 35 событий при label_source=crash (минимум 7 на фолд) и четыре
# блока для теста Фридмана на сид вместо одного.
#
# Шесть фолдов по 2 дня ПРОВЕРЕНЫ И ОТВЕРГНУТЫ (scripts/check_folds.py на
# реальных данных): при crash в фолде 0 всего 3 события, при both в фолде 5 — 4,
# то есть меньше порога 5. Вернулись к четырём.
#
# Схема — rolling origin: обучение только на днях, ПРЕДШЕСТВУЮЩИХ
# тестовым. Это строже блочной CV, где модель видела бы будущее, и
# соответствует тому, как система работала бы в эксплуатации.
#
# ИТОГОВЫЙ ПРОГОН: 5 сидов × 4 фолда = 20 блоков, 40 эпох, GPU. Порог
# калибруется на валидационных днях фолда (docs/PROTOCOL.md, §6.1), статистика
# считается по PRIMARY_COMPARISON (stad.registry). Предварительный прогон
# (1 сид, 12 эпох, шаг 2 мин, метки both) провалил две критические проверки
# протокола и не интерпретируется.
name: ft_aed_cv
grid: core
seeds: [0, 1, 2, 3, 4]

# Общий для всех архитектур, фиксируется до прогона и НЕ меняется ради одной.
param_budget: 150000

# Рабочая точка. 0.25 подтверждённой ложной тревоги в час. Тестовый фолд — около
# 23 ч записи (~6 тревог), а валидация фолда — 8-14 ч, то есть всего 2-3 ложные
# тревоги, по которым калибруется порог: он шумный (измерено check_folds.py).
# Значение выбрано на предварительном одиночном прогоне (при 1.0/ч случайный
# score выходил на уровень обученных моделей) и в этом прогоне не пересматривалось.
alarm_budget_per_hour: 0.25

half_life_min: 15.0

# Подтверждение: 3 окна подряд. При шаге 1 мин это 3 минуты устойчивого сигнала
# (при прежнем шаге 2 мин было 6). Параметр протокола (docs/PROTOCOL.md §3),
# вместе с шагом не пересматривался.
persistence: 3

primary_metric: padf
out_dir: reports/ft_aed_cv

# Каждый фолд — отдельный «датасет» для раннера, то есть отдельный блок
# в тесте Фридмана. Так CV встраивается без изменений в сам раннер.
datasets:
  fold0:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 0, n_folds: 4, fold_test_days: 3}
  fold1:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 1, n_folds: 4, fold_test_days: 3}
  fold2:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 2, n_folds: 4, fold_test_days: 3}
  fold3:
    loader: ft-aed
    from_file: configs/data/ft_aed.yaml
    kwargs: {fold: 3, n_folds: 4, fold_test_days: 3}

train:
  # 12 эпох / patience 4 — режим предварительного прогона: у
  # deep_transformer_contrastive recall был 0.000, ранняя остановка срабатывала
  # на шумном валидационном лоссе.
  epochs: 40
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 8
  d_steps: 1
  device: auto
