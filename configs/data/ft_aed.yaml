# Параметры загрузки FT-AED. Правьте этот файл, а не загрузчик.
#
# Схема проверена на реальном файле nashville_freeway_anomaly.csv
# (940 800 строк, 49 постов × 4 полосы, 20 будних дней октября 2023).

root: data/ft-aed

# Переименование столбцов. Пусто — файл уже использует ожидаемые имена
# (day, unix_time, milemarker, laneN_speed/volume/occ, human_label, crash_record).
columns: {}

# ---------------------------------------------------------------- метки
# "crash" — только официальные отчёты TDOT (44 события)
# "human" — только ручная разметка прочих аномалий (19)
# "both"  — объединение (63). В статье разметка описана как «официальные
#           отчёты плюс ручная разметка всех прочих потенциальных аномалий»,
#           то есть обе категории вместе и составляют метки датасета.
label_source: both

# ВАЖНО О ПРИРОДЕ МЕТОК. Они корридор-уровневые и точечные: каждое событие
# помечено одной 30-секундной отметкой сразу на всех 49 постах. Это отметка
# времени ОФИЦИАЛЬНОГО СООБЩЕНИЯ, а не длительность инцидента, и
# пространственной локализации в ней нет. Отсюда два следствия:
#   1. поточечные метрики по узлам справочные, ранжирование — по event-level;
#   2. вокруг отметки строится окно, иначе детектировать нечего.

# Опережающее окно: сигнал появляется в данных раньше сообщения. Бенчмарк
# FT-AED сокращает задержку оповещения более чем на 10 минут, поэтому 15 мин
# дают запас. Без него раннее обнаружение засчитывалось бы как ложная тревога.
lead_min: 15.0

# Хвост: инцидент продолжается после сообщения, типичное время устранения
# на магистрали — десятки минут. Срезать хвост нельзя: это пометило бы
# настоящие обнаружения внутри инцидента как ложные тревоги.
trail_min: 20.0

# Отметки ближе этого считаются одним событием: иначе одно ДТП, помеченное
# двумя соседними интервалами, удвоило бы знаменатель recall.
merge_gap_min: 10.0

# ------------------------------------------------------------ дискретизация
# Исходный шаг 30 с. Агрегация до 2 мин сокращает сетку вчетверо и при этом
# сохраняет разрешение, при котором сокращение задержки на 5–10 минут
# остаётся измеримым. Решение влияет на ГЛАВНУЮ метрику, поэтому
# фиксируется здесь и указывается в тексте работы.
resample_min: 2.0
window: 8          # 16 минут истории
stride: 1

# ------------------------------------------------------------------ сплиты
# Доли ДНЕЙ, не строк. Разрез посреди дня оставил бы почти идентичные
# перекрывающиеся окна по обе стороны границы.
train_days: 0.6    # 12 дней
val_days: 0.15     # 3 дня
clean_buffer: 8    # окон вокруг события исключается из обучения
n_lanes: 4
