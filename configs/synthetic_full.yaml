# Полная сетка на синтетическом коридоре.
#
# Зачем нужен отдельный синтетический прогон, если итог делается на FT-AED:
#  * аномалии вводятся физической моделью (ударная волна LWR), а не нейросетью,
#    поэтому протокол свободен от циркулярности оценки;
#  * амплитуда и частота событий управляемы — на реальных метках это невозможно;
#  * событий много, поэтому дисперсия метрик мала и ранжирование устойчиво.
#
# Выводы отсюда объясняют МЕХАНИЗМ («почему так ранжируется»), но итоговая
# таблица главы 2 диссертации строится на реальных метках.
name: synthetic_full
grid: all
seeds: [0, 1, 2, 3, 4]
param_budget: 200000
# Рабочая точка: подтверждённых ложных тревог в час на ВСЮ сеть.
# Операционная единица вместо процента FPR: бюджет внимания диспетчера
# конечен, а поточечный FPR на сети из сотен узлов вырождается —
# при FPR 1% случайный score обнаруживает почти любое событие.
alarm_budget_per_hour: 1.0

half_life_min: 15.0
# Подтверждение тревоги: столько подряд идущих окон должны превысить порог.
# Логика взята из классических AID-алгоритмов (California): инцидент даёт
# устойчивый сигнал, шум — одиночные выбросы. Без подтверждения event-recall
# случайного score вырождается в 1.0 на сети из сотен узлов.
persistence: 3

primary_metric: padf
out_dir: reports/synthetic_full

datasets:
  # три режима амплитуды = три блока сложности; тест Фридмана получает
  # больше блоков, а заодно видно, при какой выраженности аномалии
  # архитектуры начинают различаться
  synth_strong:
    loader: synthetic
    kwargs: {stations: 14, lanes: 3, days: 10, step_min: 0.5, n_events: 30, amplitude: 0.60, window: 16, seed: 11}
  synth_medium:
    loader: synthetic
    kwargs: {stations: 14, lanes: 3, days: 10, step_min: 0.5, n_events: 30, amplitude: 0.40, window: 16, seed: 22}
  synth_subtle:
    loader: synthetic
    kwargs: {stations: 14, lanes: 3, days: 10, step_min: 0.5, n_events: 30, amplitude: 0.25, window: 16, seed: 33}

train:
  epochs: 40
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  patience: 8
  d_steps: 1
  device: auto
